name: Publish to Chrome Web Store
description: Publish Chrome extensions through the Chrome Web Store API v2 using a short-lived token, with no publishing secret to store.
author: Hamza Hamidi

branding:
  icon: upload-cloud
  color: green

inputs:
  access-token:
    description: OAuth 2.0 access token with the https://www.googleapis.com/auth/chromewebstore scope, such as the access_token output of google-github-actions/auth. Use this or the refresh token inputs.
    required: false
  client-id:
    description: OAuth client ID, for the refresh token flow.
    required: false
  client-secret:
    description: OAuth client secret, for the refresh token flow.
    required: false
  refresh-token:
    description: OAuth refresh token with the chromewebstore scope, for the refresh token flow.
    required: false
  publisher-id:
    description: Publisher ID, shown on the Account page of the Chrome Web Store Developer Dashboard.
    required: true
  item-id:
    description: The 32 letter ID of the extension.
    required: true
  zip:
    description: Path to the extension ZIP, with manifest.json at its root. Use this or crx.
    required: false
  crx:
    description: Path to a CRX3 package you signed, for an item opted in to Verified CRX Uploads. The action uploads it as is and never signs anything. Use this or zip.
    required: false
  publish:
    description: Submit the uploaded version for review. Set to false to upload a draft only.
    required: false
    default: 'true'
  dry-run:
    description: Check the ZIP, that the credentials can read the item, and the store state, then report what would happen without uploading anything.
    required: false
    default: 'false'
  deploy-percentage:
    description: Share of users, 0 to 100, who get the version. On submit it sets the initial rollout. For a zip or crx of the version already published, or with rollout-only, it raises the published rollout. Google allows this only for items with more than 10,000 seven-day active users, and only upward. Needs publish true.
    required: false
  rollout-only:
    description: Set to true, with deploy-percentage and no zip or crx, to raise the rollout of the newest published version without uploading anything. It cannot be combined with skip-review, block-on-warnings or publish-type staged.
    required: false
    default: 'false'
  skip-review:
    description: Ask the store to publish without review. The store refuses the submission when the change needs review, and the run fails with the package left as a draft. Needs publish true.
    required: false
    default: 'false'
  block-on-warnings:
    description: Make the store fail the submission when validation raises warnings, instead of passing them on. Needs publish true.
    required: false
    default: 'false'
  publish-type:
    description: default makes the version live once it passes review. staged holds the approved version for up to 30 days until you publish it in the dashboard or through the API (this action does not), then it reverts to a draft.
    required: false
    default: default

outputs:
  result:
    description: submitted, uploaded (publish was false), skipped (this version was already in the store, or its rollout already reached deploy-percentage), raised (the rollout of the published version went up) or dry-run.
  state:
    description: Store state of this version when the action finished, such as PENDING_REVIEW, STAGED or PUBLISHED. Empty when result is uploaded, or dry-run for an upload, or when the store reports no state after submitting.
  version:
    description: Version read from manifest.json in the ZIP, or in the ZIP inside the CRX. With rollout-only, the newest published version.

runs:
  using: node24
  main: src/main.ts
