name: Sign a Chrome extension as CRX3
description: Sign an extension ZIP as a CRX3 package for Chrome Web Store items opted in to Verified CRX Uploads.
author: Hamza Hamidi

inputs:
  zip:
    description: Path to the extension ZIP, with manifest.json at its root.
    required: true
  private-key:
    description: The RSA private key registered for Verified CRX Uploads, as PEM. Pass it from a secret, in a job that holds no store token.
    required: true
  crx:
    description: Where to write the CRX. Defaults to the ZIP path with a .crx extension.
    required: false

outputs:
  crx:
    description: Path of the signed CRX.
  version:
    description: Version read from manifest.json in the ZIP.
  crx-id:
    description: The ID derived from the signing key. It differs from the store item ID, which the store keeps when it repackages the upload.

runs:
  using: node24
  main: main.ts
